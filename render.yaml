services:
  - type: web
    name: arraudhah-project
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Yayasan Ar-Raudhah"
      - key: APP_ENV
        value: "production"
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: "https://arraudhah-project.onrender.com"
      - key: DB_CONNECTION
        value: "sqlite"
      - key: DB_DATABASE
        value: "/var/www/html/database/database.sqlite"
      - key: SESSION_DRIVER
        value: "file"
      - key: CACHE_STORE
        value: "file"
      - key: LOG_CHANNEL
        value: "stderr"
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_PASSWORD
        generateValue: true
